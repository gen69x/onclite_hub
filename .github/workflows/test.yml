name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4
        with:
          repository: gen69x/kernel_xiaomi_onclite
          ref: test-merge

      - name: Checkout AnyKernel3
        uses: actions/checkout@v4
        with:
          repository: gen69x/AnyKernel3
          path: zipper

      - name: Build
        uses: lemniskett/android-kernel-actions@master
        id: build
        env:
          NAME: Kara-onclite
        with:
          arch: arm64
          compiler: proton-clang/master
          defconfig: onclite-perf_defconfig
          image: Image.gz-dtb

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernel-zip
          path: ${{ steps.build.outputs.outfile }}
